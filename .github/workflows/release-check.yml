name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Resolve immutable release inputs
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported release tag: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          notes="docs/RELEASE_NOTES_v${version}.md"
          if [[ ! -f "${notes}" ]]; then
            echo "Missing release notes: ${notes}" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=${version}" >> "${GITHUB_ENV}"
          echo "RELEASE_NOTES=${notes}" >> "${GITHUB_ENV}"
      - run: python -m pip install -e ".[dev,docs]" build pip-audit
      - run: python -m pytest
      - run: python scripts/verify_release.py --tag "${GITHUB_REF_NAME}"
      - run: python -m build
      - name: Verify distribution metadata
        run: |
          python -m pip install twine
          twine check dist/*
      - name: Audit released runtime environment and create SBOM
        run: |
          python -m venv build/release-venv
          build/release-venv/bin/python -m pip install --upgrade pip setuptools
          build/release-venv/bin/python -m pip install dist/*.whl
          pip-audit --path build/release-venv/lib/python3.11/site-packages
          mkdir -p release-assets
          pip-audit --path build/release-venv/lib/python3.11/site-packages \
            --format cyclonedx-json \
            --output "release-assets/LLM-Benchmark-Protocol-v${RELEASE_VERSION}.sbom.json"
      - name: Assemble release assets
        run: |
          cp dist/* release-assets/
          cp output/pdf/LLM_Benchmark_Protocol_1_0_White_Paper.pdf release-assets/
          cp docs/RANKINGS_2026-08-08.md release-assets/
          cp docs/data/kendr-catalog-pilot-2026-08-08.json release-assets/
          cp docs/data/kendr-catalog-pilot-2026-08-08.csv release-assets/
          cp docs/FRONTIER_EXECUTION_LEADERBOARD_2026-08-08.md release-assets/
          cp docs/FRONTIER_MODEL_COVERAGE_2026-08-08.md release-assets/
          cp docs/GPT_5_6_VS_5_5_ANALYSIS_2026-08-08.md release-assets/
          cp docs/data/frontier-2026-08-08/kendr-frontier-leaderboard-2026-08-08.json release-assets/
          cp docs/data/frontier-2026-08-08/kendr-frontier-leaderboard-2026-08-08.csv release-assets/
          cp docs/data/frontier-2026-08-08/kendr-frontier-leaderboard-2026-08-08.md release-assets/
          cp docs/data/frontier-2026-08-08/SHA256SUMS release-assets/frontier-2026-08-08-SHA256SUMS
          cp docs/data/frontier-preview-2026-08-08/kendr-frontier-preview-companion-2026-08-08.json release-assets/
          cp docs/data/frontier-preview-2026-08-08/kendr-frontier-preview-companion-2026-08-08.csv release-assets/
          cp docs/data/frontier-preview-2026-08-08/kendr-frontier-preview-companion-2026-08-08.md release-assets/
          cp docs/data/frontier-preview-2026-08-08/SHA256SUMS release-assets/frontier-preview-2026-08-08-SHA256SUMS
          cp docs/data/protocol-design-audit-v1/protocol-audit.json release-assets/
          cp docs/data/protocol-design-audit-v1/protocol-audit.md release-assets/
          cp assets/brand/kendr-mark-ink-512.png release-assets/
          (cd release-assets && sha256sum * > SHA256SUMS)
      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: release-assets/*
      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; refusing to overwrite immutable assets." >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --verify-tag \
            --title "LLM Benchmark Protocol ${GITHUB_REF_NAME} - KGBP 1.0 Research Release" \
            --notes-file "${RELEASE_NOTES}"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.ref_name }}
          path: release-assets/*
          if-no-files-found: error
